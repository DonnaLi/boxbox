[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boxbox"
version = "0.1.0"
description = "Real-time F1 race-strategy inference: low-latency lap-time prediction served under live race load"
requires-python = ">=3.10"
dependencies = [
    "fastf1>=3.4",
    "numpy",
    "pandas",
    "scikit-learn",
    "skl2onnx",
    "onnxruntime",
    "fastapi",
    "uvicorn",
    "httpx",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
